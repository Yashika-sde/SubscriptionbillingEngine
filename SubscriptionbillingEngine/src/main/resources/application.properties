spring.application.name=SubscriptionbillingEngine

# ? PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5433/subscription_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
