<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Billing Engine</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="nav" class="nav"></nav>
<main class="container">
    <h1>Dashboard</h1>
    <p id="error" class="alert" hidden></p>

    <section class="cards">
        <div class="card"><p class="muted">Monthly recurring revenue</p><h2 id="mrr">-</h2></div>
        <div class="card"><p class="muted">Active subscriptions</p><h2 id="active">-</h2></div>
    </section>

    <h2>Subscriptions per plan</h2>
    <table>
        <thead><tr><th>Plan</th><th>Active subscriptions</th></tr></thead>
        <tbody id="plans"></tbody>
    </table>
</main>

<script src="/js/app.js"></script>
<script>
    renderNav("Dashboard");
    (async () => {
      try {
        const r = await api("/billing/reports/mrr");
        document.getElementById("mrr").textContent = money(r.mrr);
        document.getElementById("active").textContent = r.activeSubscriptions;
        document.getElementById("plans").innerHTML = Object.entries(r.subscriptionsPerPlan)
          .map(([name, count]) => "<tr><td>" + name + "</td><td>" + count + "</td></tr>").join("")
          || '<tr><td colspan="2">No active subscriptions</td></tr>';
      } catch (e) {
        const el = document.getElementById("error");
        el.textContent = e.message;
        el.hidden = false;
      }
    })();
</script>
</body>
</html>
