<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Billing Engine</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="nav" class="nav"></nav>
<main class="container wide">
    <h1>Dashboard</h1>
    <p id="error" class="alert" hidden></p>

    <section class="cards">
        <div class="card stat"><span class="ico">💰</span>
            <div><p class="muted">Monthly recurring revenue</p><h2 id="mrr">-</h2></div></div>
        <div class="card stat"><span class="ico">👥</span>
            <div><p class="muted">Active subscriptions</p><h2 id="active">-</h2></div></div>
        <div class="card stat"><span class="ico">🧾</span>
            <div><p class="muted">Total invoices</p><h2 id="invoices">-</h2></div></div>
        <div class="card stat"><span class="ico">✅</span>
            <div><p class="muted">Revenue collected</p><h2 id="collected">-</h2></div></div>
    </section>

    <section class="grid2">
        <div class="panel"><h3>Subscriptions per plan</h3><div id="bars"></div></div>
        <div class="panel"><h3>Invoice status</h3>
            <div class="donut-wrap">
                <div id="donut" class="donut"><span id="donutNum">0</span></div>
                <ul id="legend" class="legend"></ul>
            </div>
        </div>
    </section>

    <h3>Recent invoices</h3>
    <div class="table-wrap">
        <table>
            <thead><tr><th>ID</th><th>Customer</th><th>Plan</th><th>Total</th><th>Status</th></tr></thead>
            <tbody id="recent"></tbody>
        </table>
    </div>
</main>

<script src="/js/app.js"></script>
<script>
    renderNav("Dashboard");
    const COLORS = { PAID: "#22c55e", PENDING: "#f59e0b", FAILED: "#ef4444" };

    (async () => {
      try {
        const [r, inv] = await Promise.all([api("/billing/reports/mrr"), api("/billing/Invoice/getAll")]);

        animateNumber(document.getElementById("mrr"), r.mrr, money);
        animateNumber(document.getElementById("active"), r.activeSubscriptions, v => Math.round(v));
        animateNumber(document.getElementById("invoices"), inv.length, v => Math.round(v));
        const collected = inv.filter(i => i.status === "PAID")
                             .reduce((sum, i) => sum + Number(i.total), 0);
        animateNumber(document.getElementById("collected"), collected, money);

        // bar chart: subscriptions per plan
        const entries = Object.entries(r.subscriptionsPerPlan);
        const max = Math.max(1, ...entries.map(e => e[1]));
        document.getElementById("bars").innerHTML = entries.map(([name, count]) =>
          '<div class="bar-row"><span>' + esc(name) + '</span><div class="bar"><i style="width:' +
          (count / max * 100) + '%"></i></div><b>' + count + "</b></div>").join("")
          || '<p class="muted">No active subscriptions</p>';

        // donut chart: invoice status
        const counts = { PAID: 0, PENDING: 0, FAILED: 0 };
        inv.forEach(i => { if (counts[i.status] !== undefined) counts[i.status]++; });
        const total = inv.length;
        let start = 0;
        const parts = Object.entries(counts).filter(([, n]) => n > 0).map(([status, n]) => {
          const end = start + (n / total) * 100;
          const part = COLORS[status] + " " + start + "% " + end + "%";
          start = end;
          return part;
        });
        document.getElementById("donut").style.background =
          total ? "conic-gradient(" + parts.join(", ") + ")" : "#e5e7eb";
        document.getElementById("donutNum").textContent = total;
        document.getElementById("legend").innerHTML = Object.entries(counts).map(([status, n]) =>
          '<li><i style="background:' + COLORS[status] + '"></i>' + status + " · " + n + "</li>").join("");

        // recent invoices
        document.getElementById("recent").innerHTML = inv.slice(0, 5).map(i =>
          "<tr><td>" + i.id + "</td><td>" + esc(i.subscription.customer.name) + "</td><td>" +
          esc(i.subscription.plan.name) + "</td><td>" + money(i.total) +
          '</td><td><span class="badge ' + esc(i.status) + '">' + esc(i.status) + "</span></td></tr>"
        ).join("") || '<tr><td colspan="5">No invoices yet</td></tr>';
      } catch (e) {
        const el = document.getElementById("error");
        el.textContent = e.message;
        el.hidden = false;
      }
    })();
</script>
</body>
</html>
