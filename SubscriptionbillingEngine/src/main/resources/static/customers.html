<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customers | Billing Engine</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="nav" class="nav"></nav>
<main class="container">
    <h1>Customers</h1>
    <p id="msg" class="alert" hidden></p>

    <form id="form" class="form-card">
        <div class="form-row">
            <div><label for="name">Name</label>
                <input id="name" required maxlength="100" placeholder="Subha"></div>
            <div><label for="email">Email</label>
                <input id="email" type="email" required maxlength="150" placeholder="subha@gmail.com"></div>
            <button type="submit">Add customer</button>
        </div>
    </form>

    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Email</th></tr></thead>
        <tbody id="rows"></tbody>
    </table>
</main>

<script src="/js/app.js"></script>
<script>
    const API = { list: "/billing/Customer/getAll", create: "/billing/Customer/create" };  // adjust if needed
    renderNav("Customers");

    function show(text, ok) {
      const el = document.getElementById("msg");
      el.textContent = text; el.className = "alert" + (ok ? " ok" : ""); el.hidden = false;
    }

    async function load() {
      try {
        const customers = await api(API.list);
        document.getElementById("rows").innerHTML = customers.map(c =>
          "<tr><td>" + c.id + "</td><td>" + esc(c.name) + "</td><td>" + esc(c.email) + "</td></tr>"
        ).join("") || '<tr><td colspan="3">No customers yet</td></tr>';
      } catch (e) { show(e.message, false); }
    }

    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        await api(API.create, { method: "POST", body: JSON.stringify({
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim()
        })});
        ev.target.reset();
        show("Customer added", true);
        load();
      } catch (e) { show(e.message, false); }
    });

    load();
</script>
</body>
</html>
