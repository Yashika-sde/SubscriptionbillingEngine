<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subscriptions | Billing Engine</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="nav" class="nav"></nav>
<main class="container">
    <h1>Subscriptions</h1>
    <p id="msg" class="alert" hidden></p>

    <form id="form" class="form-card">
        <div class="form-row">
            <div><label for="customer">Customer</label><select id="customer" required></select></div>
            <div><label for="plan">Plan</label><select id="plan" required></select></div>
            <button type="submit">Subscribe</button>
        </div>
    </form>

    <table>
        <thead>
        <tr><th>ID</th><th>Customer</th><th>Plan</th><th>Status</th>
            <th>Next billing</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
</main>

<script src="/js/app.js"></script>
<script>
    // adjust these paths to match your controllers
    const API = {
      customers: "/billing/Customer/getAll",
      plans: "/billing/Plan/getAll",
      list: "/billing/Sub/getAll",
      create: "/billing/Sub/create",
      base: "/billing/Sub"
    };
    renderNav("Subscriptions");
    let plans = [];

    function show(text, ok) {
      const el = document.getElementById("msg");
      el.textContent = text; el.className = "alert" + (ok ? " ok" : ""); el.hidden = false;
    }

    function planOptions(selectedId) {
      return plans.map(p =>
        '<option value="' + p.id + '"' + (p.id === selectedId ? " selected" : "") + ">" +
        esc(p.name) + " (" + money(p.price) + ")</option>").join("");
    }

    async function loadDropdowns() {
      const [customers, p] = await Promise.all([api(API.customers), api(API.plans)]);
      plans = p;
      document.getElementById("customer").innerHTML =
        customers.map(c => '<option value="' + c.id + '">' + esc(c.name) + "</option>").join("");
      document.getElementById("plan").innerHTML = planOptions();
    }

    async function loadTable() {
      const subs = await api(API.list);
      document.getElementById("rows").innerHTML = subs.map(s => {
        const active = s.status === "ACTIVE";
        const actions = active
          ? '<div class="actions">' +
              '<select id="up-' + s.id + '">' + planOptions() + "</select>" +
              '<button class="btn-sm" onclick="upgrade(' + s.id + ')">Upgrade</button>' +
              '<button class="btn-sm btn-danger" onclick="cancelSub(' + s.id + ')">Cancel</button>' +
            "</div>"
          : "-";
        return "<tr><td>" + s.id + "</td><td>" + esc(s.customer.name) + "</td><td>" +
          esc(s.plan.name) + '</td><td><span class="badge ' + esc(s.status) + '">' + esc(s.status) +
          "</span></td><td>" + esc(s.nextBillingDate) + "</td><td>" + actions + "</td></tr>";
      }).join("") || '<tr><td colspan="6">No subscriptions yet</td></tr>';
    }

    async function refresh() {
      try { await loadDropdowns(); await loadTable(); }
      catch (e) { show(e.message, false); }
    }

    async function upgrade(id) {
      const newPlanId = document.getElementById("up-" + id).value;
      try {
        await api(API.base + "/" + id + "/upgrade?newPlanId=" + newPlanId, { method: "PUT" });
        show("Plan upgraded. A prorated invoice was created.", true);
        refresh();
      } catch (e) { show(e.message, false); }
    }

    async function cancelSub(id) {
      if (!confirm("Cancel subscription " + id + "?")) return;
      try {
        await api(API.base + "/" + id + "/cancel", { method: "PUT" });
        show("Subscription cancelled", true);
        refresh();
      } catch (e) { show(e.message, false); }
    }

    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        await api(API.create, { method: "POST", body: JSON.stringify({
          customerId: Number(document.getElementById("customer").value),
          planId: Number(document.getElementById("plan").value)
        })});
        show("Subscription created", true);
        refresh();
      } catch (e) { show(e.message, false); }
    });

    refresh();
</script>
</body>
</html>
