<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoices | Billing Engine</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="nav" class="nav"></nav>
<main class="container wide">
    <h1>Invoices</h1>
    <p id="msg" class="alert" hidden></p>

    <form id="form" class="form-card">
        <div class="form-row">
            <div><label for="sub">Subscription</label><select id="sub" required></select></div>
            <button type="submit">Generate invoice</button>
        </div>
    </form>

    <div class="form-row filter">
        <div><label for="filter">Filter by status</label>
            <select id="filter">
                <option value="">All</option>
                <option value="PAID">Paid</option>
                <option value="PENDING">Pending</option>
                <option value="FAILED">Failed</option>
            </select></div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr><th>ID</th><th>Customer</th><th>Plan</th><th>Period</th><th>Amount</th>
                <th>GST</th><th>Total</th><th>Status</th><th>Due</th><th>Retries</th></tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</main>

<script src="/js/app.js"></script>
<script>
    // adjust these paths to match your controllers
    const API = {
      all: "/billing/Invoice/getAll",
      subs: "/billing/Sub/getAll",
      generate: "/billing/Invoice/generate/"
    };
    renderNav("Invoices");
    let invoices = [];

    function show(text, ok) {
      const el = document.getElementById("msg");
      el.textContent = text; el.className = "alert" + (ok ? " ok" : ""); el.hidden = false;
    }

    function draw() {
      const status = document.getElementById("filter").value;
      const list = status ? invoices.filter(i => i.status === status) : invoices;
      document.getElementById("rows").innerHTML = list.map(i =>
        "<tr><td>" + i.id + "</td>" +
        "<td>" + esc(i.subscription.customer.name) + "</td>" +
        "<td>" + esc(i.subscription.plan.name) + "</td>" +
        "<td>" + esc(i.periodStart) + " → " + esc(i.periodEnd) + "</td>" +
        "<td>" + money(i.amount) + "</td>" +
        "<td>" + money(i.tax) + "</td>" +
        "<td><strong>" + money(i.total) + "</strong></td>" +
        '<td><span class="badge ' + esc(i.status) + '">' + esc(i.status) + "</span></td>" +
        "<td>" + esc(i.dueOn) + "</td>" +
        "<td>" + i.retryCount + "</td></tr>"
      ).join("") || '<tr><td colspan="10">No invoices found</td></tr>';
    }

    async function load() {
      try {
        const [inv, subs] = await Promise.all([api(API.all), api(API.subs)]);
        invoices = inv;
        document.getElementById("sub").innerHTML = subs
          .filter(s => s.status === "ACTIVE")
          .map(s => '<option value="' + s.id + '">#' + s.id + " · " + esc(s.customer.name) +
                    " · " + esc(s.plan.name) + "</option>").join("");
        draw();
      } catch (e) { show(e.message, false); }
    }

    document.getElementById("filter").addEventListener("change", draw);

    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        const id = document.getElementById("sub").value;
        await api(API.generate + id, { method: "POST" });
        show("Invoice generated", true);
        load();
      } catch (e) { show(e.message, false); }
    });

    load();
</script>
</body>
</html>
