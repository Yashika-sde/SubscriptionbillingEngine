<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plans | Billing Engine</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="nav" class="nav"></nav>
<main class="container">
    <h1>Plans</h1>
    <p id="msg" class="alert" hidden></p>

    <form id="form" class="form-card">
        <div class="form-row">
            <div><label for="name">Name</label>
                <input id="name" required maxlength="50" placeholder="Pro"></div>
            <div><label for="price">Price (₹)</label>
                <input id="price" type="number" step="0.01" min="0.01" required placeholder="999"></div>
            <div><label for="cycle">Billing cycle</label>
                <select id="cycle">
                    <option value="MONTHLY">Monthly</option>
                    <option value="QUARTERLY">Quarterly</option>
                    <option value="YEARLY">Yearly</option>
                </select></div>
            <button type="submit">Create plan</button>
        </div>
    </form>

    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Cycle</th></tr></thead>
        <tbody id="rows"></tbody>
    </table>
</main>

<script src="/js/app.js"></script>
<script>
    const API = { list: "/billing/Plan/getAll", create: "/billing/Plan/create" };  // adjust if needed
    renderNav("Plans");

    function show(text, ok) {
      const el = document.getElementById("msg");
      el.textContent = text; el.className = "alert" + (ok ? " ok" : ""); el.hidden = false;
    }

    async function load() {
      try {
        const plans = await api(API.list);
        document.getElementById("rows").innerHTML = plans.map(p =>
          "<tr><td>" + p.id + "</td><td>" + esc(p.name) + "</td><td>" + money(p.price) +
          "</td><td>" + esc(p.billingCycle) + "</td></tr>").join("")
          || '<tr><td colspan="4">No plans yet</td></tr>';
      } catch (e) { show(e.message, false); }
    }

    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        await api(API.create, { method: "POST", body: JSON.stringify({
          name: document.getElementById("name").value.trim(),
          price: parseFloat(document.getElementById("price").value),
          billingCycle: document.getElementById("cycle").value
        })});
        ev.target.reset();
        show("Plan created", true);
        load();
      } catch (e) { show(e.message, false); }
    });

    load();
</script>
</body>
</html>
